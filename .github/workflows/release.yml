name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Release
        run: dotnet build src/WszSearcher/WszSearcher.csproj -c Release

      - name: Pack zip
        shell: pwsh
        run: |
          Compress-Archive -Path src/WszSearcher/bin/Release/net10.0-windows/* -DestinationPath WszSearcher-${{ github.ref_name }}.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: WszSearcher-*.zip
          generate_release_notes: true
